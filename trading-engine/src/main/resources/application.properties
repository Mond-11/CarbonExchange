# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5455/carbon_exchange
spring.datasource.username=${LOCAL_DB_USER:admin}
spring.datasource.password=${LOCAL_DB_PASSWORD:password}

# Hibernate settings (Create tables automatically for dev, do not use in prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Cluster
spring.kafka.bootstrap-servers=localhost:9094

# Consumer Configuration
spring.kafka.consumer.group-id=trading-engine-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer